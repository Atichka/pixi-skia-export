<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pixi + Skia</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f0f0f0; }
        .container { display: flex; gap: 20px; }
        canvas { border: 1px solid #ccc; }
        button { margin: 5px; padding: 8px 16px; cursor: pointer; }
        .status { margin-top: 20px; padding: 10px; background: #e9ecef; }
    </style>
</head>
<body>
    <h2>Pixi + Skia</h2>
    <div class="container">
        <div>
            <h3>Pixi Canvas</h3>
            <canvas id="pixi-canvas" width="800" height="600"></canvas>
        </div>
        <div>
            <h3>Skia Canvas</h3>
            <canvas id="skia-canvas" width="800" height="600"></canvas>
        </div>
    </div>
    <div>
        <button id="add-btn">➕ Добавить фигуру</button>
        <button id="clear-btn">🗑️ Очистить</button>
        <button id="pdf-btn">📄 Экспорт PDF</button>
    </div>
    <div class="status" id="status">Загрузка...</div>
    <script src="bundle.js"></script>
</body>
</html>
